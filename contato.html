<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Contato - GreenStyle</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <div class="logo">
                <div class="logo">
                <a href="index.html"><img src="imagem/WhatsApp Image 2026-04-13 at 22.11.12.jpeg" alt="" width="300"></a>
                <h3>Lojão do Lar </h3>
                <h2><span>Lírio dos Vales</span></h2>
            </div>
            <div class="nav-links">
                <a href="index.html">Início</a>
                <a href="produtos.html">Produtos</a>
                <a href="contato.html" class="active">Contato</a>
            </div>
            <div class="nav-icons">
                <i class="fas fa-search search-icon"></i>
                <div class="cart-icon-container">
                    <i class="fas fa-shopping-cart cart-icon"></i>
                    <span class="cart-count">0</span>
                </div>
                <div class="hamburger">
                    <span></span>
                    <span></span>
                    <span></span>
                </div>
            </div>
        </div>
    </nav>

    <section class="contact-page">
        <div class="container">
            <h2 class="section-title">Entre em Contato</h2>
            
            <div class="contact-wrapper">
                <!-- Formulário de Contato -->
                <div class="contact-form-container">
                    <form id="contactForm" class="contact-form">
                        <div class="form-group">
                            <label for="name">Nome Completo</label>
                            <input type="text" id="name" name="name" placeholder="Seu nome" required>
                            <span class="error-message" id="nameError"></span>
                        </div>
                        
                        <div class="form-group">
                            <label for="email">E-mail</label>
                            <input type="email" id="email" name="email" placeholder="seu@email.com" required>
                            <span class="error-message" id="emailError"></span>
                        </div>
                        
                        <div class="form-group">
                            <label for="message">Mensagem</label>
                            <textarea id="message" name="message" rows="5" placeholder="Digite sua mensagem..." required></textarea>
                            <span class="error-message" id="messageError"></span>
                        </div>
                        
                        <button type="submit" class="submit-btn">Enviar Mensagem</button>
                    </form>
                </div>

                <!-- Redes Sociais -->
                <div class="social-container">
                    <h3>Redes Sociais</h3>
                    <div class="social-links">
                        <a href="https://wa.me/5511999999999" target="_blank" class="social-link whatsapp">
                            <i class="fab fa-whatsapp"></i>
                            <span>WhatsApp</span>
                        </a>
                        <a href="https://instagram.com/greenstyle" target="_blank" class="social-link instagram">
                            <i class="fab fa-instagram"></i>
                            <span>Instagram</span>
                        </a>
                        <a href="https://facebook.com/greenstyle" target="_blank" class="social-link facebook">
                            <i class="fab fa-facebook"></i>
                            <span>Facebook</span>
                        </a>
                    </div>
                    
                    <div class="contact-info">
                        <h4>Informações de Contato</h4>
                        <p><i class="fas fa-phone"></i> (11) 99999-9999</p>
                        <p><i class="fas fa-envelope"></i> contato@greenstyle.com</p>
                        <p><i class="fas fa-map-marker-alt"></i> São Paulo, SP</p>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- Modal do Carrinho -->
    <div class="cart-modal" id="cartModal">
        <div class="cart-modal-content">
            <div class="cart-header">
                <h3>Seu Carrinho</h3>
                <span class="close-cart">&times;</span>
            </div>
            <div class="cart-items" id="cartItems"></div>
            <div class="cart-total">
                <strong>Total: R$ <span id="cartTotal">0</span></strong>
            </div>
            <button class="checkout-btn">Finalizar Compra</button>
        </div>
    </div>

    <script src="script.js"></script>
    <script>
        updateCartDisplay();
        setupContactForm();
    </script>
</body>
</html>
